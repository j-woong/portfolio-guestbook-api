spring.application.name=portfolio-guestbook-api
# 기본 프로필은 로컬, 배포에서는 환경변수 SPRING_PROFILES_ACTIVE=prod로 덮어씀
spring.profiles.active=local
# 트랜잭션 밖에서 LAZY 연관 접근 막기
spring.jpa.open-in-view=false

# 같은 사람이 글을 연달아 쓰지 못하게 하는 대기 시간(초)
app.write-cooldown-seconds=30
# 방명록 삭제용 관리자 키. 비어 있으면 삭제 API는 항상 403
app.admin-key=${ADMIN_KEY:}
